MinimumCore:
    Microarchitecture: Jupiter
    DependencyTracking: Advanced
    MemorySize: 256000
    Precision: 32

TraceVariables:
    - File: "main.c"

      LineNumber: 49

      Expression: "outputVariables[0:2]"

BenchmarkingVariables:
    - VariableName: outputVariables[0]
      VariableDescription: Calibrated Relative Humidity (%)
      OutputObject: Distribution
      CommandLineArguments: -S 0
    - VariableName: outputVariables[1]
      VariableDescription: Calibrated Temperature (in Celsius)
      OutputObject: Distribution
      CommandLineArguments: -S 1
    - VariableName: outputVariables[2]
      VariableDescription: Calibrated Temperature (in Fahrenheit)
      OutputObject: Distribution
      CommandLineArguments: -S 2

BenchmarkingAllOutputs:
    - CommandLineArguments: -S 3
